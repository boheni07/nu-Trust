stages:
  - lint
  - test
  - build
  - docker
  - deploy
  - security

variables:
  APP_NAME: "nu-trust"
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  DOCKER_BUILDKIT: "1"

  FE_DIR: "frontend"
  FE_BUILD_CMD: "npm run build"
  FE_CACHE_KEY_FE: "fe-deps"
  BE_DIR: "backend"
  BE_BUILD_CMD: "./gradlew build"
  BE_CACHE_KEY_BE: "be-deps"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  IMAGE_LATEST: "latest"

.frontend-lint: &frontend-lint |
  set -euo pipefail
  cd ${FE_DIR}
  npm install --legacy-peer-deps
  npm run lint || true

frontend-lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - "${FE_DIR}/package-lock.json"
      fallback-key: "${FE_CACHE_KEY_FE}"
    paths:
      - "${FE_DIR}/node_modules/"
  script:
    - *frontend-lint
  rules:
    - changes:
        - "${FE_DIR}/src/**/*"
        - "${FE_DIR}/package.json"
      when: always
    - when: on_success

frontend-test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - "${FE_DIR}/package-lock.json"
      fallback-key: "${FE_CACHE_KEY_FE}"
    paths:
      - "${FE_DIR}/node_modules/"
  script:
    - cd ${FE_DIR}
    - npm install --legacy-peer-deps
    - npm test || echo "No test script defined yet"
  allow_failure: true
  rules:
    - changes:
        - "${FE_DIR}/src/**/*"
      when: always
    - when: manual

backend-test:
  stage: test
  image: eclipse-temurin:${JAVA_VERSION}-jdk-alpine
  cache:
    key:
      files:
        - "${BE_DIR}/build.gradle"
      fallback-key: "${BE_CACHE_KEY_BE}"
    paths:
      - "${BE_DIR}/.gradle/caches/"
      - "${BE_DIR}/.gradle/wrapper/"
  script:
    - cd ${BE_DIR}
    - ./gradlew test --info
  allow_failure: true
  rules:
    - changes:
        - "${BE_DIR}/src/**/*"
        - "${BE_DIR}/build.gradle"
      when: always
    - when: manual

frontend-build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - "${FE_DIR}/package-lock.json"
      fallback-key: "${FE_CACHE_KEY_FE}"
    paths:
      - "${FE_DIR}/node_modules/"
  script:
    - cd ${FE_DIR}
    - npm install --legacy-peer-deps
    - ${FE_BUILD_CMD}
  artifacts:
    paths:
      - "${FE_DIR}/dist/"
    expire_in: 7 days
  rules:
    - changes:
        - "${FE_DIR}/src/**/*"
      when: always
    - when: on_success

backend-build:
  stage: build
  image: eclipse-temurin:${JAVA_VERSION}-jdk-alpine
  cache:
    key:
      files:
        - "${BE_DIR}/build.gradle"
      fallback-key: "${BE_CACHE_KEY_BE}"
    paths:
      - "${BE_DIR}/.gradle/caches/"
      - "${BE_DIR}/.gradle/wrapper/"
  script:
    - cd ${BE_DIR}
    - ./gradlew assemble
  artifacts:
    paths:
      - "${BE_DIR}/build/libs/"
    expire_in: 7 days
  rules:
    - changes:
        - "${BE_DIR}/src/**/*"
        - "${BE_DIR}/build.gradle"
      when: always
    - when: manual

docker-build-frontend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u ${DOCKER_REGISTRY_USER} -p ${DOCKER_REGISTRY_PASSWORD} ${DOCKER_REGISTRY}
    - docker build -t ${DOCKER_REGISTRY}/${APP_NAME}/frontend:${IMAGE_TAG} \
        --build-arg NODE_VERSION=${NODE_VERSION} \
        -f Dockerfile.frontend .
    - docker push ${DOCKER_REGISTRY}/${APP_NAME}/frontend:${IMAGE_TAG}
    - docker tag ${DOCKER_REGISTRY}/${APP_NAME}/frontend:${IMAGE_TAG} \
        ${DOCKER_REGISTRY}/${APP_NAME}/frontend:${IMAGE_LATEST}
    - docker push ${DOCKER_REGISTRY}/${APP_NAME}/frontend:${IMAGE_LATEST}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      when: always
    - when: manual

docker-build-backend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u ${DOCKER_REGISTRY_USER} -p ${DOCKER_REGISTRY_PASSWORD} ${DOCKER_REGISTRY}
    - docker build -t ${DOCKER_REGISTRY}/${APP_NAME}/backend:${IMAGE_TAG} \
        --build-arg JAVA_VERSION=${JAVA_VERSION} \
        -f Dockerfile.backend .
    - docker push ${DOCKER_REGISTRY}/${APP_NAME}/backend:${IMAGE_TAG}
    - docker tag ${DOCKER_REGISTRY}/${APP_NAME}/backend:${IMAGE_TAG} \
        ${DOCKER_REGISTRY}/${APP_NAME}/backend:${IMAGE_LATEST}
    - docker push ${DOCKER_REGISTRY}/${APP_NAME}/backend:${IMAGE_LATEST}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      when: always
    - when: manual

deploy-dev:
  stage: deploy
  image: amazon/aws-cli:2
  environment:
    name: dev
    url: https://dev.nutrust.kr
  variables:
    DEPLOY_ENV: "dev"
  script:
    - echo "Deploying to dev ($DEPLOY_ENV)..."
    - aws ecs update-service --cluster ${DEV_CLUSTER} --service ${APP_NAME} --force-new-deployment
      --region ${AWS_REGION}
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy-stage:
  stage: deploy
  image: amazon/aws-cli:2
  environment:
    name: stage
    url: https://stage.nutrust.kr
  variables:
    DEPLOY_ENV: "stage"
  script:
    - echo "Deploying to stage ($DEPLOY_ENV)..."
    - aws ecs update-service --cluster ${STAGE_CLUSTER} --service ${APP_NAME} --force-new-deployment
      --region ${AWS_REGION}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy-prod:
  stage: deploy
  image: amazon/aws-cli:2
  environment:
    name: prod
    url: https://nutrust.kr
  variables:
    DEPLOY_ENV: "prod"
  script:
    - echo "Deploying to prod ($DEPLOY_ENV)..."
    - aws ecs update-service --cluster ${PROD_CLUSTER} --service ${APP_NAME} --force-new-deployment
      --region ${AWS_REGION}
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual


sast:
  stage: security
  image:
    name: ${SAST_IMAGE}
    entrypoint: [""]
  script:
    - echo "Running SAST scanning..."
  allow_failure: true

secret-detection:
  stage: security
  image:
    name: ${SECRET_DETECTION_IMAGE}
    entrypoint: [""]
  script:
    - echo "Running secret detection..."
  allow_failure: true

